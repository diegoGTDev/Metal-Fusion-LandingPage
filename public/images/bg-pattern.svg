<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" preserveAspectRatio="none">
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <!-- Patrón de puntos sutiles, opacidad aumentada ligeramente para visibilidad -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#6B7280" fill-opacity="0.08" />
      <circle cx="17" cy="17" r="1.5" fill="#6B7280" fill-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
</svg>
